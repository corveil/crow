<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crow</title>
    <style>
      /* Local faces — this shell paints before crowd is listening, so it cannot
         use the daemon's /fonts route. Same files as Resources/web/fonts. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/IBMPlexSans-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("fonts/IBMPlexSans-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("fonts/IBMPlexSans-Bold.woff2") format("woff2");
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: #0A060B; color: #FF2D7A;
        font-family: "IBM Plex Sans", sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      h1 { font-size: 22px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.03em; }
      .row { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #D7C6D2; }
      .dot {
        width: 9px; height: 9px; border-radius: 50%; background: #FF2D7A;
        box-shadow: 0 0 12px #FF2D7A; animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-color-scheme: light) {
        body { background: #FAF9F5; color: #C6005B; }
        .row { color: #4A3944; }
        .dot { background: #E60073; box-shadow: 0 0 12px #E60073; }
      }
    </style>
  </head>
  <body>
    <h1>Crow</h1>
    <div class="row"><span class="dot"></span> Starting crowd…</div>
  </body>
</html>

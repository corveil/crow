name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Run tests
        run: |
          bash scripts/generate-build-info.sh
          for pkg in Packages/*/; do
            if [ -d "$pkg/Tests" ]; then
              echo "==> Testing $(basename "$pkg")..."
              swift test --enable-code-coverage --package-path "$pkg"
            fi
          done

      # The only lane that measures every package with a test target — the PR
      # lane runs an explicit 12-package allow-list (ADR 0007), which leaves out
      # ~64% of the lines, including the two worst-covered packages (CROW-928).
      - name: Summarize coverage
        if: always()
        run: bash scripts/coverage-summary.sh --allow-empty

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-macos
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: shellcheck scripts/*.sh

  release:
    name: Build & Release
    needs: [test, shellcheck]
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Extract version from tag
        run: echo "CROW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binaries
        env:
          CROW_VERSION: ${{ env.CROW_VERSION }}
        run: bash scripts/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            Download `crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz`, extract it, and put `crow` and `crowd` somewhere on your `PATH` (for example `~/.local/bin`).

            ```bash
            tar -xzf crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz
            install -m 755 crow crowd ~/.local/bin/
            ```

            Release binaries are **unsigned** (see [docs/troubleshooting.md#unsigned-builds](https://github.com/${{ github.repository }}/blob/main/docs/troubleshooting.md#unsigned-builds)). Browsers mark downloaded executables with Gatekeeper quarantine; on first run you may need to clear it:

            ```bash
            xattr -d com.apple.quarantine ~/.local/bin/crow ~/.local/bin/crowd
            ```

            Or build from source with `make build CONFIG=release && make install CONFIG=release`.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Run tests
        run: |
          bash scripts/generate-build-info.sh
          for pkg in Packages/*/; do
            if [ -d "$pkg/Tests" ]; then
              echo "==> Testing $(basename "$pkg")..."
              swift test --enable-code-coverage --package-path "$pkg"
            fi
          done

      # The only lane that measures every package with a test target — the PR
      # lane runs an explicit 12-package allow-list (ADR 0007), which leaves out
      # ~64% of the lines, including the two worst-covered packages (CROW-928).
      - name: Summarize coverage
        if: always()
        run: bash scripts/coverage-summary.sh --allow-empty

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-macos
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: shellcheck scripts/*.sh

      - name: macos-sign-notarize unit tests
        run: bash scripts/macos-sign-notarize_test.sh

  release:
    name: Build, Sign & Release
    needs: [test, shellcheck]
    # Public-repo standard GitHub-hosted minutes are free, including macos-15.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Extract version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CROW_VERSION="$(tr -d '[:space:]' < VERSION)-dev.${GITHUB_SHA:0:7}"
          else
            CROW_VERSION="${GITHUB_REF_NAME#v}"
            FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
            RELEASE_VERSION="${CROW_VERSION%%-*}"
            if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
              echo "ERROR: tag version ($RELEASE_VERSION) does not match VERSION file ($FILE_VERSION)" >&2
              exit 1
            fi
          fi
          echo "CROW_VERSION=$CROW_VERSION" >> "$GITHUB_ENV"

      - name: Build release binaries
        env:
          CROW_VERSION: ${{ env.CROW_VERSION }}
        run: bash scripts/package-release.sh

      - name: Sign and notarize
        id: sign
        env:
          CROW_VERSION: ${{ env.CROW_VERSION }}
          APPLE_DEVELOPER_SIGNING_KEY_CERT: ${{ secrets.APPLE_DEVELOPER_SIGNING_KEY_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Aliases the script + docs/macos-release-signing.md advertise.
          # Cert/password fallbacks (pre-#939 + socketzero-shaped):
          DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_BASE64 }}
          DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          RM_APPLE_DEVELOPER_SIGNING_KEY_CERT: ${{ secrets.RM_APPLE_DEVELOPER_SIGNING_KEY_CERT }}
          # API-key fallbacks (socketzero-shaped / base64 p8):
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/macos-sign-notarize.sh

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: crow-${{ env.CROW_VERSION }}-macos-universal
          path: |
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz.sha256
            crow-${{ env.CROW_VERSION }}-macos-universal.zip
            crow-${{ env.CROW_VERSION }}-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz.sha256
            crow-${{ env.CROW_VERSION }}-macos-universal.zip
            crow-${{ env.CROW_VERSION }}-macos-universal.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-body.md

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Run tests
        run: |
          bash scripts/generate-build-info.sh
          for pkg in Packages/*/; do
            if [ -d "$pkg/Tests" ]; then
              echo "==> Testing $(basename "$pkg")..."
              swift test --enable-code-coverage --package-path "$pkg"
            fi
          done

      # The only lane that measures every package with a test target — the PR
      # lane runs an explicit 12-package allow-list (ADR 0007), which leaves out
      # ~64% of the lines, including the two worst-covered packages (CROW-928).
      - name: Summarize coverage
        if: always()
        run: bash scripts/coverage-summary.sh --allow-empty

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-macos
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: shellcheck scripts/*.sh

  release:
    name: Build & Release
    needs: [test, shellcheck]
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Extract version from tag
        run: |
          CROW_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$CROW_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: tag version ($CROW_VERSION) does not match VERSION file ($FILE_VERSION)" >&2
            exit 1
          fi
          echo "CROW_VERSION=$CROW_VERSION" >> "$GITHUB_ENV"

      - name: Build release binaries
        env:
          CROW_VERSION: ${{ env.CROW_VERSION }}
        run: bash scripts/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz
            crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            Download `crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz` and its checksum file, verify the archive, extract it, and symlink the binaries into your `PATH`. Keep the extracted directory intact — `crowd` needs the `.bundle` resources next to the binaries.

            ```bash
            shasum -a 256 -c crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz.sha256
            mkdir -p ~/.local/lib ~/.local/bin
            tar -xzf crow-${{ env.CROW_VERSION }}-macos-universal.tar.gz -C ~/.local/lib
            ln -sf ~/.local/lib/crow-${{ env.CROW_VERSION }}/crow ~/.local/bin/crow
            ln -sf ~/.local/lib/crow-${{ env.CROW_VERSION }}/crowd ~/.local/bin/crowd
            ```

            Release binaries are **unsigned** (see [docs/troubleshooting.md#unsigned-builds](https://github.com/${{ github.repository }}/blob/main/docs/troubleshooting.md#unsigned-builds)). Browsers mark downloaded executables with Gatekeeper quarantine; on first run you may need to clear it:

            ```bash
            xattr -d com.apple.quarantine ~/.local/bin/crow ~/.local/bin/crowd 2>/dev/null || true
            ```

            Or build from source with `make daemon CONFIG=release && make install CONFIG=release`.

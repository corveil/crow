name: CI

on:
  pull_request:
    # Base-branch filter: stacked feature PRs (e.g. onto crow-593) need CI too.
    branches: [main, 'feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR Swift build/test runs on Linux to avoid burning macOS Actions minutes.
  # Swift is provided by the official swift:6 container (no Xcode). We build and
  # test the Foundation-only packages that compile on Linux — the macOS-only
  # GUI (root Crow target + CrowTerminal, all AppKit/SwiftUI) and
  # CrowTelemetry (Apple Network.framework) are compiled only by release.yml.
  # See docs/adr/0007-linux-ci-swift.md.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container: swift:6.1
    # Inside a container, Actions defaults the shell to `sh` (dash); force bash
    # so the array-based package loop below works.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Container runs as root; the checkout is owned by a different uid, so
      # git refuses to operate on it until it's marked safe. generate-build-info
      # calls `git -C` (with a "dev" fallback), so this just lets it read the SHA.
      # The identity is required by CrowGit's rebase tests, which run real
      # `git rebase`/commit in throwaway repos that inherit this global config.
      - name: Configure git for CI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "ci@crow.test"
          git config --global user.name "Crow CI"

      # Generates CrowCLI's CLIVersion.swift (and the GUI's unused BuildInfo.swift).
      - name: Generate build info
        run: bash scripts/generate-build-info.sh

      - name: Restore SwiftPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swift-build-Linux-${{ hashFiles('Package.swift', 'Packages/*/Package.swift') }}
          restore-keys: swift-build-Linux-

      # Explicit allow-list of packages that compile on Linux. A new package
      # must be added here consciously; do NOT loop over Packages/*/ — that
      # would pull in the macOS-only CrowTerminal / CrowTelemetry.
      - name: Build & test Linux packages
        run: |
          LINUX_PACKAGES=(CrowCore CrowIPC CrowClaude CrowCodex CrowCursor \
                          CrowAntigravity CrowGit CrowOpenCode CrowGrok CrowPersistence CrowProvider CrowCLI)
          for pkg in "${LINUX_PACKAGES[@]}"; do
            echo "==> Building & testing $pkg on Linux..."
            # --enable-code-coverage on BOTH invocations, deliberately: toggling
            # the flag invalidates SwiftPM's build plan, so an uninstrumented
            # build here would be thrown away and recompiled from scratch by the
            # instrumented `swift test` below. That is a full second compile of
            # all 12 packages on a lane that keeps no compiled products between
            # runs (ADR 0007) — sharing the flag makes the build reusable.
            swift build --enable-code-coverage --package-path "Packages/$pkg"
            # --no-parallel: the CrowIPC socket tests spin up real servers with
            # blocking I/O; running them in parallel starves each other on the
            # constrained CI runner and intermittently hits the read timeout.
            # The export lands at Packages/$pkg/.build/<triple>/debug/codecov/.
            swift test --no-parallel --enable-code-coverage --package-path "Packages/$pkg"
          done

      # Measurement only — no gate, no ratchet, no third-party upload (CROW-928).
      # This lane measures only what LINUX_PACKAGES lists; the rest of the tree is
      # ~64% of the lines and refreshes at release tags, per ADR 0007.
      #
      # "Not in the allow-list" is not the same as "cannot build here":
      # CrowAutostart is #if canImport-guarded and CrowCLI links it, so it does
      # compile on Linux and shows up in the report as a "—" row (linked, never
      # tested in this lane) rather than as a measured number. Adding it to
      # LINUX_PACKAGES would turn that into a real figure — deliberately left as
      # a follow-up, since ADR 0007 wants allow-list changes made consciously.
      - name: Summarize coverage
        if: always()
        run: bash scripts/coverage-summary.sh --allow-empty

      # always(): a red suite is exactly when the covered/uncovered split is worth
      # having. The summary describes only the exports that exist, so a lane that
      # died partway yields a smaller table, never a wrong one.
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-linux
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

  # Source-level drift gates: cheap text checks that need no Swift build, so they
  # cover packages the Linux lane above cannot compile. `check-cli-parity.sh` is
  # the PR-lane stand-in for CrowDaemonTests/RPCLedgerParityTests — CrowDaemon
  # depends on the Darwin-only CrowTelemetry and so is absent from LINUX_PACKAGES,
  # which would otherwise leave the RPC half of the parity gate running only on
  # release tags (CROW-807, docs/adr/0016-cli-control-plane-parity.md).
  #
  # Plain ubuntu-latest rather than the swift container: check-notification-events
  # needs node, which the container does not ship.
  parity:
    name: Catalog & Parity Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLI/RPC control-plane parity (CROW-807)
        run: bash scripts/check-cli-parity.sh

      # Was previously reachable only via `make test`, which CI never runs.
      - name: Notification-event catalogs (CROW-768)
        run: bash scripts/check-notification-events.sh

      # Ported from the deleted Tests/CrowTests/CustomInstructionsSkillTests when
      # the root monolith test tree was removed (CROW-926); guards issue #683.
      - name: Workspace custom-instructions skill guard (#683)
        run: bash scripts/check-workspace-custom-instructions.sh

      - name: NSLog ban (CROW-874)
        run: bash scripts/check-no-nslog.sh

      # The jsdom web-UI harness ran nowhere in CI until CROW-936 — it was a
      # local-only suite, so a web regression could only be caught by whoever
      # remembered to run it. This job already needs node (see above), so it is
      # the cheapest place to gate it.
      #
      # `test:ci` deliberately omits row.test.js, which has 10 failures already
      # on main (CROW-802 drift — its own comment explains it: PR status parts
      # became SVG `.ico` spans, the `r.glyphs` assertions still read text-only
      # `.pr-ico`). Running the full suite here would fail every PR. See
      # Packages/CrowDaemon/web-tests/README.md.
      - name: Web UI tests (jsdom)
        working-directory: Packages/CrowDaemon/web-tests
        run: |
          npm install --no-audit --no-fund
          npm run test:ci

  desktop:
    name: Desktop (Tauri) Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build crow-desktop (Rust/Tauri)
        run: cargo build --manifest-path crow-desktop/src-tauri/Cargo.toml

  # Cheap cross-cutting invariants that no compiler enforces. These live in
  # `make test` too, but that only runs locally — before this job, nothing ran
  # them in CI at all.
  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: shellcheck scripts/*.sh

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- CROW-988: parity with index.html. `viewport-fit=cover` lets the #1e1e1e
       background go full-bleed (the safe-area inset on body below keeps the last
       row off the home indicator), and `interactive-widget=resizes-content`
       makes Chrome/Android shrink the layout viewport for the software keyboard
       so the plain `resize` fit below self-corrects there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Crow Terminal</title>
  <link rel="stylesheet" href="/xterm/xterm.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }
    /* Under viewport-fit=cover the page runs under the home indicator, so inset
       the grid — otherwise the prompt line sits behind it once the keyboard
       closes (CROW-988). border-box keeps the page exactly one viewport tall. */
    body {
      box-sizing: border-box;
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* CROW-1006: iOS must not pop its own long-press sheet over the grid — the
       #ctxmenu below is what a long-press opens here. Nothing is lost: xterm.css
       already marks the grid `user-select: none`. */
    #terminal {
      width: 100%;
      height: 100%;
      -webkit-touch-callout: none;
    }
    /* Our own right-click / long-press menu — tmux's mouse menu is suppressed below. */
    #ctxmenu {
      position: fixed; z-index: 50; display: none;
      background: #252526; border: 1px solid #3c3c3c; border-radius: 6px;
      padding: 4px; min-width: 140px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
      font: 13px -apple-system, system-ui, sans-serif; color: #d4d4d4; user-select: none;
      -webkit-touch-callout: none;
    }
    #ctxmenu button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: inherit; padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit;
    }
    #ctxmenu button:hover { background: #04395e; }
    #ctxmenu button:disabled { color: #6a6a6a; cursor: default; background: none; }
    /* Finger-sized rows where the menu is reached by long-press (CROW-1006). */
    @media (pointer: coarse) {
      #ctxmenu { min-width: 200px; font-size: 15px; }
      #ctxmenu button { padding: 11px 12px; }
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="ctxmenu"></div>
  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/xterm-addon-fit.js"></script>
  <script src="/xterm/xterm-addon-image.js"></script>
  <script src="/xterm/xterm-addon-crow-jumpbottom.js"></script>
  <script src="/xterm/xterm-addon-crow-viewport.js"></script>
  <script>
    // WebSocket transport variant of CrowTerminal's terminal.html. The xterm.js
    // config block is copied verbatim so font/scrollback/inline-image behavior
    // matches the macOS surface; only the WKWebView message bus is swapped for a
    // WebSocket carrying raw PTY bytes (binary) + a resize control frame (JSON).
    (function () {
      if (typeof Terminal !== 'function') {
        console.error('Crow: Terminal constructor missing (xterm.js failed to load)');
        return;
      }

      const fitAddon = new FitAddon.FitAddon();
      const imageAddon = new ImageAddon.ImageAddon({
        sixelSupport: true,
        iipSupport: true,
        kittySupport: true,
      });
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: '"MesloLGS NF", "MesloLGS Nerd Font", "JetBrainsMono Nerd Font", "Hack Nerd Font", "FiraCode Nerd Font", Menlo, Monaco, monospace',
        theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
        scrollback: 50000,
        allowTransparency: true,
      });
      term.loadAddon(fitAddon);
      term.loadAddon(imageAddon);

      // The shared tmux server sets `mouse on` (crow-tmux.conf) so the macOS
      // surface gets wheel-scrollback + drag-copy through tmux copy-mode. In the
      // browser that's wrong: xterm.js enters mouse-reporting mode, forwards every
      // click/drag to tmux, and tmux draws its OWN right-click menu and eats
      // drag-select — so text can't be copied. Swallow the mouse-tracking
      // DECSET/DECRST toggles (?1000/1002/1003/1006/…) at the parser so xterm.js
      // never reports the mouse: native selection, our context menu, and
      // wheel-scroll all work client-side instead (CROW-581). Inner apps that
      // want the mouse (vim/htop) lose it in the browser — an acceptable trade.
      //
      // DELIBERATELY UNCONDITIONAL here, unlike app.js (#824). app.js makes the
      // swallow depend on surface kind so agent TUIs own their own wheel
      // (ADR-0013), which needs the `agent_surface` flag from `list-terminals`
      // and an `activeTerminal` to hang it on — neither exists on this
      // single-terminal debug page. The #822 frame sediment is fixed SERVER-side
      // (per-window `alternate-screen on`), so this page benefits from that fix
      // regardless; what it gives up is only the wheel forwarding. So the two
      // files are expected to differ now — do NOT "resync" this with app.js.
      const MOUSE_MODES = new Set([1000, 1001, 1002, 1003, 1005, 1006, 1015, 1016]);
      function swallowMouseMode(params) {
        const arr = params && params.params ? params.params : params;
        const len = arr ? arr.length : 0;
        for (let i = 0; i < len; i++) {
          const v = arr[i];
          if (MOUSE_MODES.has(Array.isArray(v) ? v[0] : v)) return true; // handled → drop it
        }
        return false; // not a mouse mode → let xterm apply it normally
      }
      term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, swallowMouseMode);
      term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, swallowMouseMode);

      term.open(document.getElementById('terminal'));
      // Jump-to-bottom pill (#668) — load after open() so it can anchor its
      // button to the terminal container.
      term.loadAddon(new CrowJumpBottomAddon.CrowJumpBottomAddon());
      // CROW-988: keep the grid inside the visual viewport so a phone's software
      // keyboard can't cover the prompt line. Inert without visualViewport and
      // until something keyboard-sized occludes the page. `sendResize` is a
      // hoisted function declaration, so passing it before its definition below
      // is fine.
      if (typeof CrowViewportAddon === 'object' && CrowViewportAddon
          && typeof CrowViewportAddon.CrowViewportAddon === 'function') {
        term.loadAddon(new CrowViewportAddon.CrowViewportAddon({ onResize: sendResize }));
      }

      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(proto + '://' + window.location.host + '/terminal');
      ws.binaryType = 'arraybuffer';

      function sendToPTY(text) {
        if (text && ws.readyState === WebSocket.OPEN) {
          ws.send(new TextEncoder().encode(text));
        }
      }

      // Copy. Cross-platform combos that never steal the shell's Ctrl+C
      // (SIGINT): Cmd+C on macOS, Ctrl+Shift+C elsewhere. A no-op (passes
      // through) when there's no selection.
      function copySelection() {
        const sel = term.getSelection();
        if (!sel) return;
        // The key handler cancels the browser's own copy, so this must always
        // deliver — mirrors app.js's copyToClipboard/fallbackCopy pair. Over
        // plain http (a `--host 0.0.0.0` daemon) navigator.clipboard is absent
        // entirely, and writeText can still reject where it exists; without the
        // legacy fallback either case would be a silent no-op (review).
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(sel).catch(function () { fallbackCopy(sel); });
        } else {
          fallbackCopy(sel);
        }
      }
      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (_) { /* best effort */ }
        document.body.removeChild(ta);
      }
      function pasteClipboard() {
        // Guarded like app.js's pasteIntoTerminal: navigator.clipboard is absent
        // over plain http, where this would otherwise throw out of the menu
        // click. Cmd+V is unaffected either way — the browser pastes it natively.
        if (!(navigator.clipboard && navigator.clipboard.readText)) return;
        // Route through xterm so bracketed-paste wraps it — hidden newlines in the
        // clipboard would otherwise auto-execute in the shell (review).
        navigator.clipboard.readText().then(function (t) { if (t) term.paste(t); }).catch(function () {});
      }
      term.attachCustomKeyEventHandler(function (e) {
        if (e.type !== 'keydown') return true;
        // Shift+Enter → CSI-u, so Claude Code can tell it from a plain Enter
        // and inserts a newline instead of submitting (#598/CROW-916). xterm's
        // key table has no shiftKey branch for keyCode 13, so both chords
        // otherwise reach the PTY as the same bare \r. crow-tmux.conf's
        // `extended-keys on` + `xterm*:extkeys` carries this to apps that
        // negotiate extended keys and downgrades it to a plain \r for apps
        // that don't, so nothing leaks into vim or a shell.
        //
        // Option+Enter is deliberately NOT handled: xterm maps altKey + Enter
        // to ESC CR natively, so a branch here would only restate the library.
        // `!e.altKey` keeps Shift+Option+Enter on that native path.
        //
        // preventDefault() is required: returning false makes xterm's _keyDown
        // return before its own cancel (#875), and this handler waves the
        // keypress phase through — an uncancelled keydown would write a second
        // \r there.
        if (e.key === 'Enter' && e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
          sendToPTY('\x1b[13;2u');
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        const copyCombo = (e.metaKey && !e.ctrlKey) || (e.ctrlKey && e.shiftKey);
        if (copyCombo && (e.key === 'c' || e.key === 'C')) {
          if (term.hasSelection()) {
            copySelection();
            // Returning false only makes xterm skip its own key handling — the
            // browser's default gesture keeps going unless we cancel it (#875).
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          return true; // no selection → let it through (e.g. Ctrl+C SIGINT)
        }
        // #875: the paste combos are deliberately NOT handled here. Pasting
        // explicitly *and* returning false double-pasted, because the browser's
        // native paste still fired xterm's own `paste` listener. Left alone,
        // that listener pastes exactly once (bracketed-paste wrapped), needs no
        // clipboard-read permission, and works over plain http. The right-click
        // menu still calls pasteClipboard() — a click is not a paste gesture.
        return true;
      });

      // Custom right-click menu (tmux's is suppressed by the mouse-mode swallow).
      const menu = document.getElementById('ctxmenu');
      function hideMenu() { menu.style.display = 'none'; }
      function addItem(label, enabled, fn) {
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !enabled;
        b.onclick = function () { hideMenu(); fn(); };
        menu.appendChild(b);
      }
      function openMenu(x, y) {
        menu.innerHTML = '';
        const hasSel = term.hasSelection();
        addItem('Copy', hasSel, copySelection);
        addItem('Paste', true, pasteClipboard);
        addItem('Select All', true, function () { term.selectAll(); });
        addItem('Clear', true, function () { term.clear(); });
        menu.style.display = 'block';
        const mw = menu.offsetWidth || 140, mh = menu.offsetHeight || 120;
        menu.style.left = Math.min(x, window.innerWidth - mw - 4) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - mh - 4) + 'px';
      }
      const termEl = document.getElementById('terminal');
      termEl.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        openMenu(e.clientX, e.clientY);
      });
      // Touch has no right-click, and the grid is `user-select: none`, so without
      // this bridge copy/paste were unreachable on a phone (CROW-1006). Mirrors
      // app.js's attachLongPress: fire at the touch point after ~500ms if the
      // finger hasn't moved past a small threshold, then swallow the emulated
      // click so the trailing tap doesn't immediately hideMenu().
      (function attachLongPress(node) {
        let timer = null, sx = 0, sy = 0, fired = false;
        const clear = function () { if (timer) { clearTimeout(timer); timer = null; } };
        node.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) { clear(); return; }
          fired = false;
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          clear();
          timer = setTimeout(function () { fired = true; timer = null; openMenu(sx, sy); }, 500);
        }, { passive: true });
        node.addEventListener('touchmove', function (e) {
          if (!timer) return;
          const t = e.touches[0];
          if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clear();
        }, { passive: true });
        node.addEventListener('touchend', function (e) {
          clear();
          if (fired) { e.preventDefault(); fired = false; }
        });
        node.addEventListener('touchcancel', clear, { passive: true });
      })(termEl);
      window.addEventListener('click', hideMenu);
      window.addEventListener('blur', hideMenu);

      function sendResize() {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
        }
      }

      ws.onopen = function () {
        sendResize();
        // Keystrokes → PTY. Encode as UTF-8 bytes (binary frame) so multibyte
        // input round-trips exactly like the macOS `term.onData` path.
        term.onData(function (data) {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(new TextEncoder().encode(data));
          }
        });
      };

      ws.onmessage = function (event) {
        // Raw PTY bytes (binary). Feed xterm a Uint8Array, never a string, so
        // UTF-8 multibyte sequences (Claude/Cursor TUIs) stay intact.
        if (event.data instanceof ArrayBuffer) {
          term.write(new Uint8Array(event.data));
        } else {
          term.write(event.data);
        }
      };

      ws.onclose = function () {
        term.write('\r\n\x1b[31m[crow] terminal disconnected\x1b[0m\r\n');
      };

      window.addEventListener('resize', sendResize);
    })();
  </script>
</body>
</html>

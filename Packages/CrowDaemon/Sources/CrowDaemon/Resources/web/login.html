<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crow — Sign in</title>
  <!-- Web app manifest + apple-touch-icon (CROW-1073): the login page is served
       pre-auth, so an install prompt reached here still gets the Crow identity. -->
  <link rel="icon" type="image/svg+xml" href="/brand.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0A060B">
  <!-- Standalone: the auth gate blocks app.css/app.js until you're in, so this
       page inlines its layout and loads only the exempt theme + fonts (CROW-593,
       CROW-1316). The boot script sets data-theme before theme.css paints. -->
  <script>
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('crow.color-scheme') || 'system'; } catch (e) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (pref === 'light' || pref === 'dark') ? pref : (dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#FAF9F5' : '#0A060B');
      if (pref === 'system' && window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var sync = function () {
          var next = mq.matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          if (meta) meta.setAttribute('content', next === 'light' ? '#FAF9F5' : '#0A060B');
        };
        if (mq.addEventListener) mq.addEventListener('change', sync);
      }
    })();
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg-deep); color: var(--text-primary);
           font: 14px/1.5 var(--font-ui); }
    .card { width: 320px; padding: 28px; background: var(--bg-surface); border: 1px solid var(--border-strong);
            border-radius: 10px; box-shadow: 0 8px 30px var(--overlay); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand img { width: 28px; height: 28px; }
    .brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
    label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    input[type=password] { width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
            background: var(--bg-deep); color: var(--text-primary);
            border: 1px solid var(--border-strong); border-radius: 6px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; margin-top: 16px; padding: 10px; font-size: 14px; font-weight: 600;
             font-family: inherit; cursor: pointer; background: var(--accent-fill);
             color: var(--on-accent); border: none; border-radius: 6px; }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 12px; min-height: 16px; font-size: 12px; color: var(--red); }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><img src="/brand.svg" alt=""><h1>Crow</h1></div>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const pw = document.getElementById('pw');
    const submit = document.getElementById('submit');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      err.textContent = '';
      submit.disabled = true;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value }),
        });
        if (r.ok) {
          // Keep the deep link (CROW-936). The auth middleware serves this page
          // *at the requested URL* — no redirect — so a #/sessions/<id> fragment
          // is still in the address bar and must survive the hop to the app.
          // At "/" the target is the current URL, and assigning it would not
          // reload, so reload() is the one that works there.
          if (location.pathname === '/') location.reload();
          else location.replace('/' + (location.hash || ''));
          return;
        }
        err.textContent = r.status === 429
          ? 'Too many attempts — wait a minute and try again.'
          : 'Incorrect password.';
      } catch (_) {
        err.textContent = 'Network error — is the daemon reachable?';
      }
      submit.disabled = false;
      pw.select();
    });
  </script>
</body>
</html>
